[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sie"
version = "0.1.0"
description = "Sports Intelligence Engine: event-level medal data pipeline and analytics"
requires-python = ">=3.11"
dependencies = [
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.1",
  "pydantic>=2.5",
  "pydantic-settings>=2.2",
  "typer>=0.12",
  "pandas>=2.2",     # analytics and reports
  "openpyxl>=3.1",   # Excel export
]

[project.optional-dependencies]
# Event-level analytics, reports and the static dashboard (ADR-018 gives the justification).
reports = [
  "pandas>=3.0",
  "openpyxl>=3.1",  # pandas' Excel writer for the xlsx reports
]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.5",
  "pgserver>=0.1",   # embedded PostgreSQL for local tests when no TEST_DATABASE_URL is set
]
browser = ["playwright>=1.45"]   # optional: renders every dashboard page in tests/unit/test_dashboard_pages.py

[project.scripts]
sie = "sie.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"sie.db" = ["sql/*.sql"]
"sie.web" = ["*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# ruff format owns code layout; long lines inside SQL strings are more readable unwrapped.
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]
