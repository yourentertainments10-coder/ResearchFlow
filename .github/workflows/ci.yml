name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sie
          POSTGRES_PASSWORD: sie
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sie"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # The test suite creates and drops its own databases on this server.
      TEST_DATABASE_URL: postgresql://sie:sie@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest --cov=sie --cov-report=term-missing
