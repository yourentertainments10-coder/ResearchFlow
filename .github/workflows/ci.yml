name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sie
          POSTGRES_PASSWORD: sie
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sie"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # The test suite creates and drops its own databases on this server.
      TEST_DATABASE_URL: postgresql://sie:sie@localhost:5432/postgres
      REQUIRE_AGE: "1"
      REQUIRE_BROWSER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev,reports,browser]"
      # Chromium for the dashboard smoke tests (tests/dashboard_smoke.py). REQUIRE_BROWSER=1 makes a
      # missing browser a failure instead of a skip.
      - run: playwright install --with-deps chromium
      - run: ruff check .
      - run: ruff format --check .
      # Backup encryption tests (ADR-034) need the age tool; REQUIRE_AGE makes a missing tool a failure.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq age
      - run: pytest --cov=sie --cov-report=term-missing --junitxml=pytest-report.xml
      # Makes failures readable in the check run UI and API even when the raw log is not reachable.
      - if: failure()
        run: python .github/scripts/annotate_failures.py pytest-report.xml
