# Local PostgreSQL for development: docker compose up -d db
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: sie
      POSTGRES_PASSWORD: sie
      POSTGRES_DB: sie
    ports:
      - "5432:5432"
    volumes:
      - sie_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sie -d sie"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  sie_pgdata:
