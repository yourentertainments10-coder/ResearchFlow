<script>
const D=__DATA__,META=__META__;
const $=i=>document.getElementById(i);
const app=$('app');
const attrs=(e,s)=>s.split('" ').forEach(p=>{const i=p.indexOf('=');if(i>0)e.setAttribute(p.slice(0,i),p.slice(i+1).replace(/^"/,'').replace(/"$/,''))});
const h=(t,c,...k)=>{let tag=t,ta='';const ti=t.indexOf('" ');if(ti>0){tag=t.slice(0,ti);ta=t.slice(ti+2)}
 const e=document.createElement(tag);if(ta)attrs(e,ta);
 if(c){const parts=c.split('" ');e.className=parts[0];parts.slice(1).forEach(p=>attrs(e,p))}
 k.flat().forEach(x=>{if(x==null||x===false)return;e.append(x.nodeType?x:document.createTextNode(String(x)))});return e};
const SHORT={"People's Republic of China":'China','Republic of Korea':'Korea','Islamic Republic of Iran':'Iran',"Democratic People's Republic of Korea":'North Korea','Hong Kong, China':'Hong Kong',"Lao People's Democratic Republic":'Laos'};
const sn=n=>SHORT[n]||n;
const pct=(a,b)=>b?Math.round(a/b*1000)/10:0;
const fmt=n=>Number(n).toLocaleString('en');
const MEDC={G:'var(--gold)',S:'var(--silver)',B:'var(--bronze)'},MEDN={G:'Gold',S:'Silver',B:'Bronze'};
// ---- gender buckets: Open events can be counted as Mixed (official table) or shown separately ----
const OPEN={asMixed:true};
const gOf=r=>(r.g==='Open'&&OPEN.asMixed)?'Mixed':r.g;
const GB=()=>OPEN.asMixed?['Men','Women','Mixed']:['Men','Women','Mixed','Open'];
const GCOL={Men:'--c1',Women:'--c2',Mixed:'--c3',Open:'--c4'};
// ---- derived data (pure arithmetic over the validated rows) ----
const names={};D.forEach(r=>names[r.c]=r.cn);
function tally(rows){const t={G:0,S:0,B:0,T:0};rows.forEach(r=>{t[r.m[0]]++;t.T++});return t}
function group(rows,key){const m={};rows.forEach(r=>(m[r[key]]=m[r[key]]||[]).push(r));return m}
const byCountry=group(D,'c'),bySport=group(D,'s');
const rankCmp=(a,b)=>b.G-a.G||b.S-a.S||b.B-a.B||b.T-a.T;
const COUNTRIES=Object.keys(byCountry).map(c=>({c,n:sn(names[c]),full:names[c],...tally(byCountry[c])})).sort(rankCmp).map((x,i)=>({...x,rank:i+1}));
const CMAP=Object.fromEntries(COUNTRIES.map(x=>[x.c,x]));
const SPORTS=Object.keys(bySport).sort();
const nEvents=rows=>new Set(rows.map(z=>z.s+'|'+z.e)).size;
function sportsOf(c){return Object.entries(group(byCountry[c],'s')).map(([s,r])=>({s,...tally(r)})).sort((a,b)=>b.T-a.T||rankCmp(a,b))}
function hhi(list,k){const t=list.reduce((a,x)=>a+x[k],0);return Math.round(list.reduce((a,x)=>a+(x[k]/t)**2,0)*10000)}
// Labelling convention used on this site (not an external standard): HHI below 1,000 diversified, 1,000-1,799 moderate, 1,800 and above concentrated.
const conc=v=>v<1000?'Diversified':v<1800?'Moderate':'Concentrated';
function genderOf(rows){const n={};GB().forEach(k=>n[k]=0);rows.forEach(r=>n[gOf(r)]++);return n}
function profile(c){const sp=sportsOf(c),T=CMAP[c].T,g=genderOf(byCountry[c]),hv=hhi(sp,'T');return{sp,top1:pct(sp[0].T,T),top3:pct(sp.slice(0,3).reduce((a,x)=>a+x[T?'T':'T'],0),T),hhi:hv,label:conc(hv),g,women:pct(g.Women||0,T)}}
// location quotient: share of a country's medals in a sport divided by that sport's share of all medals
function topLQ(c){const T=CMAP[c].T;let best=null;sportsOf(c).forEach(z=>{if(z.T<3)return;const lq=(z.T/T)/(bySport[z.s].length/D.length);if(!best||lq>best.lq)best={s:z.s,lq,n:z.T}});return best}
const DATES=[...new Set(D.map(r=>r.d).filter(Boolean))].sort();
const UND=D.filter(r=>!r.d);
const XS=[...DATES,...(UND.length?['']:[])];           // '' = medals with no date, shown as a last, labelled point
const xlabel=d=>d?d.slice(5).replace('-','/'):'no date';
const undDesc=()=>{const e=[...new Set(UND.map(r=>r.s+' · '+r.en))];return e.join('; ')};
const openText=()=>{const o=D.filter(r=>r.g==='Open'),by=group(o,'s'),parts=Object.keys(by).sort().map(s=>{const a=nEvents(by[s]),b=nEvents(bySport[s]);return a===b?`all ${a} ${s}`:`${a} of ${b} ${s}`});return `${nEvents(o)} Open events: ${parts.join(', ')}`};
// ---- tooltip ----
const tip=$('tip');
function showTip(e,lines){tip.replaceChildren();lines.forEach(l=>{const d=h('div');if(l.k){const k=h('span','k');k.style.background=l.k;d.append(k)}if(l.t)d.append(h('span','t',l.t+' '));if(l.b!==undefined)d.append(h('b','',l.b));tip.append(d)});tip.style.display='block';const w=tip.offsetWidth;tip.style.left=Math.max(6,Math.min(e.clientX+14,innerWidth-w-8))+'px';tip.style.top=(e.clientY+14)+'px'}
const hideTip=()=>tip.style.display='none';
function hover(el,lines){el.addEventListener('pointermove',e=>showTip(e,lines));el.addEventListener('pointerleave',hideTip);el.addEventListener('focus',()=>{const r=el.getBoundingClientRect();showTip({clientX:r.left,clientY:r.bottom},lines)});el.addEventListener('blur',hideTip);el.tabIndex=0}
const info=text=>{const i=h('i','info','i');i.setAttribute('aria-label',text);hover(i,[{t:text}]);return i};
// ---- components ----
function medalBar(t,max,label){const s=h('div','stk');s.style.width=Math.max(2,t.T/max*100)+'%';['G','S','B'].forEach(k=>{if(!t[k])return;const i=h('i');i.style.width=(t[k]/t.T*100)+'%';i.style.background=MEDC[k];hover(i,[{t:(label?label+' · ':'')+MEDN[k],b:t[k]},{t:'Total',b:t.T}]);s.append(i)});return s}
function barRow(name,node,val,onclick,cur){const r=h('div','brow'+(onclick?' link':'')+(cur?' cur':''),h('span','nm',name),h('div','',node),h('span','v',val));if(onclick){r.onclick=onclick;r.tabIndex=0;r.onkeydown=e=>{if(e.key==='Enter')onclick()}}return r}
function simpleBar(frac,color,lines){const b=h('div','stk');const i=h('i');i.style.width=Math.max(1.5,frac*100)+'%';i.style.background=color;i.style.borderRadius='6px';b.append(i);if(lines)hover(i,lines);return b}
function mpLegend(){return h('div','legend',...['G','S','B'].map(k=>{const s=h('span');const i=h('i');i.style.background=MEDC[k];s.append(i,MEDN[k]);return s}))}
function sel(label,options,value,onchange){const s=h('select');options.forEach(o=>{const v=typeof o==='string'?{v:o,l:o}:o;const op=h('option','',v.l);op.value=v.v;if(v.v===value)op.selected=true;s.append(op)});s.onchange=()=>onchange(s.value);return h('label','',label,s)}
// searchable select: type to filter, pick from the list (native datalist, keyboard friendly)
function combo(label,options,value,onchange,allLabel){const id='dl'+Math.random().toString(36).slice(2,8),cur=options.find(o=>o.v===value),inp=h('input');inp.className='cb';inp.setAttribute('list',id);inp.placeholder=allLabel||'Search or choose…';inp.value=cur?cur.l:'';inp.autocomplete='off';
