function heatmap(rows,nC,nS){const cs=COUNTRIES.filter(x=>rows.some(r=>r.c===x.c)).slice(0,nC).map(x=>x.c);const sub=rows.filter(r=>cs.includes(r.c));

 const bins=[1,2,4,7,11],bin=v=>v?bins.filter(b=>v>=b).length:0,dark=matchMedia('(prefers-color-scheme:dark)').matches||document.documentElement.dataset.theme==='dark';
 const t=h('table','hm'),hr=h('tr');hr.append(h('th'));sp.forEach(s=>hr.append(h('th','c',h('div','',s))));t.append(hr);
 cs.forEach(c=>{const tr=h('tr');tr.append(h('th','r',c));sp.forEach(s=>{const v=cnt[c+'|'+s]||0,b=bin(v),td=h('td','',v||'');td.style.background='var(--h'+b+')';td.style.color=b>=3?(dark&&b>=4?'#0b0b0b':'#fff'):'var(--fg)';hover(td,[{t:sn(names[c])+' · '+s,b:v+' medals'}]);tr.append(td)});t.append(tr)});
 const lg=h('div','legend',...['1','2–3','4–6','7–10','11+'].map((l,i)=>{const s=h('span'),k=h('i');k.style.background='var(--h'+(i+1)+')';s.append(k,l);return s}));
 return h('div','',lg,h('div','scroll',t))}
function lineChart(codes,colors){const W=640,H=250,L=36,R=78,T=10,B=24;const series=codes.map(c=>{let a=0;return{c,pts:DATES.map(d=>a+=byCountry[c].filter(r=>r.d===d).length)}});
 const mx=Math.max(1,...series.map(s=>s.pts[s.pts.length-1])),step=mx>400?100:mx>150?50:mx>60?20:mx>30?10:5,top=Math.ceil(mx/step)*step;

 ends.forEach(o=>add('text',{x:x(DATES.length-1)+9,y:o.y+4},o.s.c+' '+o.s.pts[o.s.pts.length-1]));

  showTip(e,[{t:DATES[i]},...series.slice().sort((a,b)=>b.pts[i]-a.pts[i]).map(s=>({k:colors[s.c],t:s.c,b:s.pts[i]}))])});
 hit.addEventListener('pointerleave',()=>{cross.setAttribute('visibility','hidden');hideTip()});
 const lg=h('div','legend',...series.map(s=>{const sp=h('span'),k=h('i','ln');k.style.background=colors[s.c];sp.append(k,CMAP[s.c].n);return sp}));

$('theme').onclick=()=>{const dark=document.documentElement.dataset.theme?document.documentElement.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;setTheme(dark?'light':'dark');render()};
render();
</script></html>
